<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurant Directory | MenuRadar</title><meta name="description" content="Browse the MenuRadar restaurant directory by country, city and menu category."><link rel="canonical" href="https://menuradar.github.io/directory.html"><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="logo" href="/">Menu<span>Radar</span></a><nav><a href="/">Home</a><a href="/#countries">Countries</a></nav></header><main><section class="section"><p class="eyebrow">RESTAURANT DIRECTORY</p><h1>Restaurant Menus Directory</h1><p class="lead" style="margin:15px 0 28px">Browse restaurants by country and city.</p><div id="directory" class="country-grid"></div></section></main><footer><div class="footer-inner"><b>MenuRadar</b><span>Restaurant Menus, Prices & More</span></div></footer><script src="/data/restaurants.js"></script><script>const root=document.getElementById('directory');(window.MENURADAR_RESTAURANTS||[]).forEach(r=>{const a=document.createElement('a');a.className='country';a.href='/'+r.country+'/'+r.city+'/'+r.slug+'/';a.innerHTML='<b>'+r.name+'</b><span>'+r.city.replaceAll('-',' ')+' · '+r.category+' · '+r.price+'</span>';root.appendChild(a)});</script></body></html>
