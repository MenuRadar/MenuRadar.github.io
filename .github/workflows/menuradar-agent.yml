name: MenuRadar Free Autopilot
on:
  workflow_dispatch:
  repository_dispatch:
    types: [menuradar_agent]
permissions:
  contents: write
jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests pillow
      - name: Run MenuRadar Free Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGENT_SOURCE: ${{ github.event.client_payload.source || inputs.source }}
          AGENT_SOURCE_URL: ${{ github.event.client_payload.source_url || inputs.source_url }}
          MAX_IMAGES: ${{ github.event.client_payload.max_images || inputs.max_images || '4' }}
        run: python scripts/menuradar_agent.py
      - name: Commit generated article and images
        run: |
          git config user.name "MenuRadar Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml usa/ uk/ france/ brazil/ australia/ assets/agent/ 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "🤖 MenuRadar Free Agent: publish article"
          git push
