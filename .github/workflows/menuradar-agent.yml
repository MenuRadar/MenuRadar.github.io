name: MenuRadar Free Autopilot
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Optional raw source content"
        required: false
        type: string
      source_url:
        description: "Restaurant menu source URL"
        required: false
        type: string
      max_images:
        description: "Maximum images"
        required: false
        default: "4"
        type: string
      edit_existing:
        description: "Edit an existing article"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [menuradar_agent]
  push:
    paths:
      - ".github/agent-run.txt"
permissions:
  contents: write
concurrency:
  group: menuradar-agent-publish
  cancel-in-progress: false
jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests pillow
      - name: Run MenuRadar Free Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGENT_SOURCE: ${{ github.event.client_payload.source || inputs.source }}
          AGENT_SOURCE_URL: ${{ github.event.client_payload.source_url || inputs.source_url || 'https://menupricetoday.com/us/brands/kfc/menu?branch=kfc-2662-main-st-f72e2a7b' }}
          MAX_IMAGES: ${{ github.event.client_payload.max_images || inputs.max_images || '4' }}
          EDIT_EXISTING: ${{ github.event.client_payload.edit_existing || inputs.edit_existing || 'false' }}
        run: python scripts/menuradar_agent.py
      - name: Commit generated article and images
        run: |
          git config user.name "MenuRadar Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml admin/agent-preview.json usa/ uk/ france/ brazil/ australia/ assets/agent/ 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "🤖 MenuRadar Free Agent: publish article"
          git push
